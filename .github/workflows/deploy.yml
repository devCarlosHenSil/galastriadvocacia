name: Verificação

# D86 — a **publicação** é feita pela Cloudflare Pages (a integração com o
# GitHub: a Cloudflare constrói o repositório e publica-o). Este workflow
# **só verifica** — é o check `build` que a branch protection de `main`
# exige.
#
# Porquê o gatilho `pull_request` (F1): a branch protection exige o status
# check `build`, que **só** era reportado num push para `main`. Num pull
# request não havia check nenhum, a aprovação era impossível e o PR que
# fecha as 12 rotações ficava bloqueado.
#
# ⚠️ Não há **nenhuma** capacidade de publicação neste ficheiro: sem
# `pages: write`, sem `id-token: write`, sem `deploy-pages` e sem
# `upload-pages-artifact`. A publicação é da Cloudflare (e passa pelo gate
# da rotação, em `scripts/build-pages.mjs`).
on:
  push:
    # SEC-N-10 — a branch que **publica** (a "production branch" do projecto
    # da Cloudflare Pages) tem de ser verificada pelo CI: enquanto o PR #3
    # não for fundido, é `feat/cloudflare-pages-worker` (ver
    # `docs/PROJECT-STATE.md` §20.3). Quando o PR entrar, volta a ser
    # `main` — e esta lista volta a ser só `main`.
    branches: [main, feat/cloudflare-pages-worker]
  pull_request:
    branches: [main, feat/cloudflare-pages-worker]
  workflow_dispatch:

# SEC-52: menor privilégio. `contents: read` no topo; cada job escala apenas
# o que precisa. Nenhum job tem `contents: write` nem `write-all`.
permissions:
  contents: read

# SEC-51: nunca dois builds concorrentes. O grupo inclui o evento e o ref: um
# `pull_request` **não** cancela o push para `main` (e vice-versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SEC-R-07: the job that runs `npm` must NOT be able to publish. It only
    # reads the repository — the publication is the Cloudflare Pages', with
    # its own gate.
    permissions:
      contents: read
    steps:
      # SEC-50: the 2 actions fixadas no SHA de commit.
      # SEC-54: `persist-credentials: false` — o GITHUB_TOKEN não fica
      # gravado em `.git/config` e não pode ser reutilizado por um step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      # SEC-49: `npm ci` (não `npm install`) — o lockfile tem de bater com o
      # `package.json` ou o build não arranca.
      - run: npm ci

      # REV-2: o `verify-workflow` usa o pacote `yaml` (uma devDependency) — por
      # isso só pode correr **depois** do `npm ci` (antes, o runner não tem
      # `node_modules` e o step morria com MODULE_NOT_FOUND). Continua a correr
      # antes de qualquer build ou publicação.
      - name: Verificar o workflow (SEC-50…SEC-55)
        run: node scripts/verify-workflow.mjs

      # SEC-49 / SEC-R-11: o audit corre com a exceção **fixada pelo ID do
      # advisory** (docs/security-decisions.md): um advisory novo — ou um
      # advisory fora da lista — reprova o build.
      - name: Audit (exceção fixada pelo ID do advisory)
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node scripts/check-audit.mjs audit.json

      # SEC-55: a guarda de segredos corre como step próprio, ANTES do build.
      - run: node scripts/guard-secrets.mjs

      # REV-7: a verificação de tipos (`astro check`) — o `astro build` **não**
      # verifica os tipos.
      - name: Verificar os tipos (astro check)
        run: npm run check

      # D3 — a Function do formulário. As **asserções estáticas** correm em
      # qualquer Node (o CI está no Node 20); a fase de **comportamento**
      # precisa de Node ≥ 22.6 e corre no job `functions` (Node 22).
      - name: Verificar a Function do formulário (SEC-34)
        run: npm run check:function

      # REV-06 / REV-07: a **lógica da publicação** — o `build command` da
      # Cloudflare Pages (`scripts/build-pages.mjs`) é o que decide o que se
      # publica (o gate da rotação, e o `ROTATION_GATE=skip` do D88). É
      # exercitado **localmente**, nos três estados: sem `PRODUCTION_BRANCH`
      # (falha fechado), em pré-visualização (o gate é saltado) e em
      # produção (o gate corre). Nada é publicado.
      - name: A lógica da publicação (o gate e o fail-closed)
        run: node scripts/check-build-pages.mjs
        env:
          SITE_BASE: '/'
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || '/api/contact' }}

      # `npm run build` executa o `prebuild`, que repete a guarda.
      - run: npm run build
        env:
          SITE_BASE: '/'
          # D86 — o endpoint do formulário (a Pages Function do próprio site).
          # Não é um segredo: o valor por omissão é o mesmo em todo o lado
          # (a Function vive no domínio canónico).
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || '/api/contact' }}

      # C16: as verificações que leem o `dist/` — sem elas, uma CSP que
      # divergiu do runbook, um link interno quebrado, uma classe que divergiu
      # do Elementor ou uma regressão de contraste passam em silêncio.
      - name: Verificar a CSP contra o runbook (SEC-R-05)
        run: node scripts/verify-csp.mjs

      - name: Paridade estrutural (R1, R2)
        run: node scripts/check-parity.mjs

      - name: Links internos
        run: node scripts/check-links.mjs

      - name: Contraste (A1…A25)
        run: node scripts/check-contrast.mjs

      # REV-6: as regras de redireccionamento (o `/home/` → `/`) — o registo
      # tem de bater com o ficheiro `public/_redirects`.
      - name: Regras de redireccionamento
        run: node scripts/check-redirects.mjs

      # C3 / C16: o auto-teste da guarda (salta sem o backup local).
      - name: Auto-teste da guarda de segredos (SEC-R-27)
        run: node scripts/guard-self-test.mjs

      # D9: o artefacto publicado é verificado — o `dist/` é o que vai para o
      # Cloudflare Pages: um `javascript:` ou um `onerror=` nele é um XSS
      # publicado.
      - name: Verificar o artefacto publicado
        run: node scripts/check-dist.mjs

  # D3 — a fase de **comportamento** da Function (`scripts/check-function.mjs`)
  # precisa de um Node que leia TypeScript (≥ 22.6). O job `build` corre no
  # Node 20 (lá só correm as asserções estáticas), por isso há este job no
  # **Node 22**. Ele **não** publica nada — as permissões são as mesmas
  # mínimas de sempre.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O build confirma que o site compila também no Node 22 (a Function é
      # type-checked pelo `astro check`).
      - run: npm run build
        env:
          SITE_BASE: '/'
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || '/api/contact' }}

      - name: Verificar a Function do formulário (estático + comportamento)
        run: npm run check:function
